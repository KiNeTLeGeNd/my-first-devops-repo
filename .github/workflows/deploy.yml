name: Full Stack Application Deployment Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        "DB_PASSWORD=secret" | Out-File -FilePath .env -Encoding utf8
        "APP_PORT=8080" | Out-File -FilePath .env -Encoding utf8 -Append

    - name: Deploy with Docker Compose
      run: |
        docker compose down --remove-orphans
        docker rm -f devops-app devops-db
        docker compose up -d --build
        Start-Sleep -Seconds 20
        docker compose ps

    - name: Verify containers are running
      run: |
        $status = docker compose ps
        if ($status -match "Up") {
          Write-Host "All containers are running"
        } else {
          Write-Host "Some containers failed to start"
          docker compose logs
          exit 1
        }

    - name: Run application tests
      run: |
        try {
          $response = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing
          Write-Host "Web application is healthy"
        } catch {
          Write-Host "Web application health check failed"
          exit 1
        }

        $DB_COUNT = (docker compose exec -T db psql -U app -d appdb -t -c "SELECT COUNT(*) FROM items;").Trim()
        $WEB_COUNT = (Invoke-WebRequest -Uri "http://localhost:8080/api/items" -UseBasicParsing).Content | Select-String -Pattern 'id' -AllMatches | ForEach-Object { $_.Matches } | Measure-Object | Select-Object -ExpandProperty Count

        Write-Host "Database count: $DB_COUNT"
        Write-Host "Web API count: $WEB_COUNT"

        if ($DB_COUNT -eq $WEB_COUNT) {
          Write-Host "Data consistency test passed"
        } else {
          Write-Host "Data consistency test failed"
          exit 1
        }
