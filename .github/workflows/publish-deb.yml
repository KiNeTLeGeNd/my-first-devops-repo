name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

jobs:
  build-publish-verify:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Package .deb (all inside Docker)
        id: pack
        shell: powershell
        run: |
          $VER = (Select-String -Path main.go -Pattern 'const Version = "([0-9.]+)"').Matches.Groups[1].Value
          echo "Version: $VER"
          echo "pkg_ver=$VER" >> $env:GITHUB_OUTPUT
          
          docker run --rm -v "${PWD}:/src" -w /src golang:1.21 bash -c "apt-get update -qq && apt-get install -y -qq dpkg > /dev/null && go mod init syspulse || true && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/syspulse . && mkdir -p build/syspulse_1.2.0/DEBIAN build/syspulse_1.2.0/usr/bin && cp dist/syspulse build/syspulse_1.2.0/usr/bin/syspulse && chmod 755 build/syspulse_1.2.0/usr/bin/syspulse && printf 'Package: syspulse\nVersion: 1.2.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: DevOps Team <devops@example.com>\nDescription: Lightweight CLI tool for a system health snapshot\n Reads /proc and reports uptime, load average and memory info.\nDepends: libc6 (>= 2.17)\n' > build/syspulse_1.2.0/DEBIAN/control && dpkg-deb --build --root-owner-group build/syspulse_1.2.0 dist/syspulse_1.2.0_amd64.deb"
          
          echo "deb_path=dist/syspulse_1.2.0_amd64.deb" >> $env:GITHUB_OUTPUT

      - name: Upload .deb to Nexus (REST API)
        shell: powershell
        run: |
          $debPath = "dist/syspulse_1.2.0_amd64.deb"
          curl.exe --fail --silent --show-error `
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" `
            -X POST `
            "http://${{ secrets.NEXUS_HOST }}:8081/service/rest/v1/components?repository=syspulse" `
            -H "accept: application/json" `
            -F "apt.asset=@$debPath;type=application/x-debian-package"
          echo "Uploaded."

      - name: Verify install via apt in Ubuntu container
        shell: powershell
        run: |
          $nexusHost = "${{ secrets.NEXUS_HOST }}"
          $cmd = "apt-get update -y -o Acquire::Retries=3 && apt-get install -y --no-install-recommends ca-certificates curl && echo 'deb [trusted=yes] http://host.docker.internal:8081/repository/syspulse/ stable main' > /etc/apt/sources.list.d/syspulse.list && apt-get update -y -o Acquire::Retries=3 && apt-get install -y syspulse && syspulse --version"
          docker run --rm -e NEXUS_HOST="$nexusHost" ubuntu:22.04 bash -c "$cmd"
