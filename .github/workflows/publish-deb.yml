name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

jobs:
  build-publish-verify:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build static Linux binary
        shell: powershell
        run: |
          mkdir dist -Force
          $env:GOOS="linux"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="0"
          go build -o dist/syspulse .
          Get-ChildItem dist\syspulse

      - name: Package as .deb (via Docker)
        id: pack
        shell: powershell
        run: |
          $VER = (Select-String -Path main.go -Pattern 'const Version = "([0-9.]+)"').Matches.Groups[1].Value
          echo "Version: $VER"
          echo "pkg_ver=$VER" >> $env:GITHUB_OUTPUT
          
          # Запускаем контейнер Ubuntu, который сам создаст структуру и соберет .deb
          docker run --rm -v "${PWD}:/src" -w /src ubuntu:22.04 bash -c "apt-get update -qq && apt-get install -y -qq dpkg > /dev/null && mkdir -p build/syspulse_$VER/DEBIAN build/syspulse_$VER/usr/bin && cp dist/syspulse build/syspulse_$VER/usr/bin/syspulse && chmod 755 build/syspulse_$VER/usr/bin/syspulse && printf 'Package: syspulse\nVersion: $VER\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: DevOps Team <devops@example.com>\nDescription: Lightweight CLI tool for a system health snapshot\n Reads /proc and reports uptime, load average and memory info.\nDepends: libc6 (>= 2.17)\n' > build/syspulse_$VER/DEBIAN/control && dpkg-deb --build --root-owner-group build/syspulse_$VER dist/syspulse_$VER`_amd64.deb"
          
          echo "deb_path=dist/syspulse_$VER`_amd64.deb" >> $env:GITHUB_OUTPUT

      - name: Upload .deb to Nexus (REST API)
        shell: powershell
        run: |
          $debPath = "${{ steps.pack.outputs.deb_path }}"
          curl.exe --fail --silent --show-error `
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" `
            -X POST `
            "http://${{ secrets.NEXUS_HOST }}:8081/service/rest/v1/components?repository=syspulse" `
            -H "accept: application/json" `
            -F "apt.asset=@$debPath;type=application/x-debian-package"
          echo "Uploaded."

      - name: Verify install via apt in Ubuntu container
        shell: powershell
        run: |
          $nexusHost = "${{ secrets.NEXUS_HOST }}"
          docker run --rm -e NEXUS_HOST="$nexusHost" ubuntu:22.04 bash -c "
            apt-get update -y && apt-get install -y --no-install-recommends ca-certificates curl
            echo 'deb [trusted=yes] http://'`$NEXUS_HOST':8081/repository/syspulse/ stable main' > /etc/apt/sources.list.d/syspulse.list
            apt-get update && apt-get install -y syspulse
            syspulse --version
          "
