name: Build & Publish syspulse .deb to Nexus (APT)

on:
  push:
    branches: ["release"]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"

jobs:
  build-publish-verify:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build static Linux binary
        shell: pwsh
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/syspulse .
          ls -lh dist/syspulse

      - name: Package as .deb (via Docker)
        id: pack
        shell: bash
        run: |
          PKG=syspulse
          VER=$(grep -oP 'const Version = "\K[0-9.]+' main.go)
          echo "Version: ${VER}"
          echo "pkg_ver=${VER}" >> $GITHUB_OUTPUT

          docker run --rm -v "$(pwd):/src" -w /src golang:1.21 bash -c "
            apt-get update -qq && apt-get install -y -qq dpkg > /dev/null
            ROOT=build/${PKG}_${VER}
            mkdir -p \"\${ROOT}/DEBIAN\" \"\${ROOT}/usr/bin\"
            cp dist/syspulse \"\${ROOT}/usr/bin/${PKG}\"
            chmod 755 \"\${ROOT}/usr/bin/${PKG}\"
            cat > \"\${ROOT}/DEBIAN/control\" <<EOF
          Package: ${PKG}
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: DevOps Team <devops@example.com>
          Description: Lightweight CLI tool for a system health snapshot
           Reads /proc and reports uptime, load average and memory info.
          Depends: libc6 (>= 2.17)
          EOF
            dpkg-deb --build --root-owner-group \"\${ROOT}\" \"dist/${PKG}_${VER}_amd64.deb\"
          "
          echo "deb_path=dist/${PKG}_${VER}_amd64.deb" >> $GITHUB_OUTPUT

      - name: Upload .deb to Nexus (REST API)
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            -X POST \
            "http://${{ secrets.NEXUS_HOST }}:8081/service/rest/v1/components?repository=syspulse" \
            -H "accept: application/json" \
            -F "apt.asset=@${{ steps.pack.outputs.deb_path }};type=application/x-debian-package"
          echo "Uploaded."

      - name: Verify install via apt in Ubuntu container
        shell: bash
        run: |
          docker run --rm \
            -e NEXUS_HOST="${{ secrets.NEXUS_HOST }}" \
            ubuntu:22.04 bash -c '
              apt-get update -y && apt-get install -y --no-install-recommends ca-certificates curl
              echo "deb [trusted=yes] http://${NEXUS_HOST}:8081/repository/syspulse/ stable main" > /etc/apt/sources.list.d/syspulse.list
              apt-get update && apt-get install -y syspulse
              syspulse --version
            '
